name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/calculator.test.cjs
      - run: docker compose config --quiet
      - run: docker build -t rollenpreis:test .
      - name: Container smoke test
        run: |
          docker run -d --name rollenpreis-test --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 8841:8080 rollenpreis:test
          trap 'docker logs rollenpreis-test; docker rm -f rollenpreis-test' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8841/healthz
          curl --fail http://127.0.0.1:8841/ > /dev/null
